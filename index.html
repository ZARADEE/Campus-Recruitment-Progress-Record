<!doctype html>

  <title>求职进度台</title>
  <style>
    :root {

    .stage-item::after { content: ""; position: absolute; z-index: 0; height: 2px; width: calc(100% - 22px); left: calc(50% + 11px); top: 10px; background: #e0e5e1; }

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const stageNames = ["投递", "测评", "笔试", "AI面试", "简历筛选", "面试", "Offer", "入职"];
    const rounds = [
      { id: "first", label: "一面" },
      { id: "second", label: "二面" },
      { id: "third", label: "三面" },
      { id: "hr", label: "HR 面" }
    ];
    let jobs = [
      {
        id: "sample-applied", company: "示例科技", mark: "示", markTone: "coral", title: "前端开发工程师", city: "上海", team: "用户产品", status: "applied", stageIndex: 5, activeRound: "second", posted: "2026-10-06", created: "2026-10-12", appliedAt: "2026-10-19", updated: "今天 10:42", source: "官网", salary: "面议", tags: ["React", "TypeScript", "B 端产品"],
        jd: "负责商业化产品的 Web 端研发与体验迭代；参与前端工程建设，和产品、设计及服务端协作交付核心功能。", activity: ["完成二面笔试题复盘", "进入二面流程", "已完成在线测评"], sessions: {
          first: { date: "2026-11-14", result: "通过", summary: "重点讨论项目拆解、React 渲染机制和跨团队协作。", questions: [
            { id: "sq1", question: "介绍一个你负责的前端项目。你如何拆分模块并推进交付？", answer: "先说明业务目标和约束，再按页面、状态与数据边界拆模块。项目里我把筛选区、结果表格和详情抽屉拆成独立模块，共用查询参数和请求状态。联调阶段用固定接口契约减少前后端等待。" },
            { id: "sq2", question: "React 中 useMemo 和 useCallback 分别解决什么问题？", answer: "两者用于缓存渲染期间的计算结果和函数引用，是否使用要看依赖变化与子组件是否做了引用比较。它们有维护成本，不应默认套在每个值上。" },
            { id: "sq3", question: "页面请求失败时，如何设计错误恢复？", answer: "区分可重试的网络错误和不可恢复的业务错误，保留用户已输入条件，提供就地重试并记录请求标识。涉及局部刷新时避免整个页面清空。" }
          ] },
          second: { date: "2026-11-21", result: "进行中", summary: "", questions: [
            { id: "sq4", question: "设计一个支持百万级数据的前端列表，需要考虑哪些方面？", answer: "" },
            { id: "sq5", question: "项目中如何处理请求竞态和过期响应？", answer: "" }
          ] },
          third: { date: "", result: "待安排", summary: "", questions: [] },
          hr: { date: "", result: "待安排", summary: "", questions: [] }
        }
      },
      {
        id: "netease", company: "网易", mark: "网", markTone: "blue", title: "前端研发工程师", city: "杭州", team: "游戏事业部", status: "applied", stageIndex: 5, activeRound: "first", posted: "2026-09-28", created: "2026-10-08", appliedAt: "2026-10-22", updated: "昨天 16:20", source: "官网", salary: "面议", tags: ["Vue", "可视化", "游戏工具"],
        jd: "参与游戏研发工具与运营平台建设，负责复杂交互和数据可视化体验，持续优化稳定性与开发效率。", activity: ["收到一面邀约", "投递简历", "录入岗位信息"], sessions: {
          first: { date: "2026-11-20", result: "进行中", summary: "", questions: [{ id: "nq1", question: "请讲讲你处理过的一个性能问题，以及如何定位瓶颈。", answer: "" }] },
          second: { date: "", result: "待安排", summary: "", questions: [] }, third: { date: "", result: "待安排", summary: "", questions: [] }, hr: { date: "", result: "待安排", summary: "", questions: [] }
        }
      }
    ];
    let opportunities = [
      { id: "rednote", company: "小红书", mark: "红", tone: "coral", title: "AI 产品前端工程师", city: "上海", posted: "2026-11-18", created: "2026-11-20", source: "招聘官网", salary: "面议", jd: "参与 AI 创作工具与内容社区的前端体验建设，关注复杂交互、性能和可访问性。", tags: ["React", "AI 应用", "内容平台"] },
      { id: "tencent", company: "腾讯", mark: "腾", tone: "blue", title: "前端开发工程师（WXG）", city: "深圳", posted: null, created: "2026-11-19", source: "Markdown", salary: "面议", jd: "参与微信相关 Web 产品研发，和产品及设计协作完成用户体验与基础能力迭代。", tags: ["TypeScript", "工程化", "跨端"] },
      { id: "alibaba", company: "阿里云", mark: "云", tone: "amber", title: "前端研发工程师", city: "杭州", posted: "2026-11-15", created: "2026-11-20", source: "招聘官网", salary: "面议", jd: "负责云产品控制台及开发者工具的前端实现，提升复杂业务场景下的操作效率。", tags: ["Vue", "设计系统", "云计算"] }
    ];
    let resumes = [];
    let knowledgeDocuments = (() => {
      try {
        const saved = JSON.parse(localStorage.getItem("campus-knowledge-documents") || "[]");
        return Array.isArray(saved) ? saved : [];
      }
      catch { return []; }
    })();
    const desktopInvoke = window.__TAURI__?.core?.invoke;
    const isDesktop = typeof desktopInvoke === "function";
    let activeView = "pipeline";
    let currentJobId = "sample-applied";
    let currentRoundId = "second";
    let currentQuestionId = "sq4";
    let archiveSelection = { jobId: "sample-applied", roundId: "first" };
    let addMode = "file";
    let importDrafts = [];
    let searchQuery = "";
    let cityFilter = "";
    let opportunitySort = "created";
    let selectedResumeId = null;
    let selectedKnowledgeId = null;
    let jobDetailId = null;
    let jobDetailReturnView = "opportunities";
    let toastTimer;
    let resumeSaveTimer;
    let knowledgeSaveTimer;

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
    const icon = (name, extra = "") => `<svg class="icon ${extra}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
    const escapeHtml = (value = "") => String(value).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    const fmtDate = value => value ? value.replaceAll("-", ".") : "未提供";
    const getJob = id => jobs.find(job => job.id === id);
    const getAnyJob = id => getJob(id) || opportunities.find(job => job.id === id);
    const shortUrl = value => { try { const url = new URL(value); return `${url.hostname}${url.pathname === "/" ? "" : url.pathname}`; } catch { return value || "未提供"; } };
    const getSession = (job, roundId) => job.sessions[roundId] || (job.sessions[roundId] = { date: "", result: "待安排", summary: "", questions: [] });
    const stageLabel = job => job.status === "closed" ? "流程已终止" : job.stageIndex === 5 ? `${rounds.find(round => round.id === job.activeRound)?.label || "一面"}中` : job.stageIndex === 7 ? "已入职" : job.stageIndex === 6 ? "Offer" : `${stageNames[job.stageIndex]}中`;
    const matchesSearch = job => `${job.company} ${job.title} ${job.city} ${job.jd}`.toLocaleLowerCase().includes(searchQuery.trim().toLocaleLowerCase());
    const draftKey = (jobId, roundId) => `campus-draft:${jobId}:${roundId}`;
    function restoreDrafts() {
      if (!isDesktop) return;
      for (const job of jobs) for (const round of rounds) {
        try {
          const raw = localStorage.getItem(draftKey(job.id, round.id));
          if (raw) {
            const draft = JSON.parse(raw);
            if (Array.isArray(draft.questions)) job.sessions[round.id] = draft;
          }
        } catch { /* An invalid draft does not replace the saved record. */ }
      }
    }
    function weekInterviews() {
      const start = new Date(); start.setHours(0,0,0,0); start.setDate(start.getDate() - (start.getDay() + 6) % 7);
      const end = new Date(start); end.setDate(start.getDate() + 7);
      return jobs.reduce((count, job) => count + Object.values(job.sessions).filter(session => { const date = new Date(`${session.date}T00:00:00`); return date >= start && date < end; }).length, 0);
    }

    async function refreshNativeData() {
      const records = await desktopInvoke("list_jobs");
      jobs = records.filter(job => job.status === "applied" || job.status === "closed");
      opportunities = records.filter(job => job.status === "opportunity");
      resumes = await desktopInvoke("list_resumes");
      knowledgeDocuments = await desktopInvoke("list_knowledge_documents");
      if (!resumes.some(resume => resume.id === selectedResumeId)) selectedResumeId = resumes[0]?.id || null;
      if (!knowledgeDocuments.some(document => document.id === selectedKnowledgeId)) selectedKnowledgeId = knowledgeDocuments[0]?.id || null;
      restoreDrafts();
      if (!getJob(currentJobId)) currentJobId = jobs[0]?.id || null;
      if (!getJob(archiveSelection.jobId)) {
        const firstWithSessions = jobs.find(job => Object.values(job.sessions).some(session => session.questions.length));
        archiveSelection = { jobId: firstWithSessions?.id || null, roundId: "first" };
      }
      render();
    }

    async function initializeDesktop() {
      if (!isDesktop) return;
      jobs = [];
      opportunities = [];
      currentJobId = null;
      $("#browser-file-picker").hidden = true;
      $("#native-file-picker").style.display = "inline-flex";
      $("#file-note").textContent = "Markdown、Word 与 CSV 会在本机解析，检查字段后保存。CSV 支持一行一个岗位。";
      try {
        await refreshNativeData();
      } catch (error) {
        showToast(`无法读取本地数据库：${String(error)}`);
      }
    }

    function showToast(message) {
      const toast = $("#toast");
      toast.textContent = message;
      toast.classList.add("visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("visible"), 2600);
    }

    function setView(view) {
      if (activeView === "interview") saveCurrentQuestion();
      if (activeView === "resumes") {
        clearTimeout(resumeSaveTimer);
        persistResumeEditor(false);
      }
      if (activeView === "knowledge") {
        clearTimeout(knowledgeSaveTimer);
        persistKnowledgeDocument(false);
      }
      activeView = view;
      $$(".nav-link").forEach(button => {
        const isActive = button.dataset.view === view || (view === "interview" && button.dataset.view === "pipeline") || (view === "job-detail" && button.dataset.view === "opportunities");
        button.classList.toggle("active", isActive);
        if (isActive) button.setAttribute("aria-current", "page"); else button.removeAttribute("aria-current");
      });
      const labels = { pipeline: "正在推进", opportunities: "看看机会", archive: "面试记录", knowledge: "知识积累", interview: "面试复盘", resumes: "个人简历", "job-detail": "岗位 JD" };
      $("#crumb-current").textContent = labels[view] || "正在推进";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function render() {
      $("#opportunity-count").textContent = opportunities.length;
      $("#pipeline-count").textContent = jobs.filter(job => job.status === "applied").length;
      const sessionCount = jobs.reduce((sum, job) => sum + Object.values(job.sessions).filter(session => session.questions.length > 0).length, 0);
      $("#archive-count").textContent = sessionCount;
      $("#knowledge-count").textContent = knowledgeDocuments.length;
      $("#resume-count").textContent = resumes.length;
      const main = $("#main-content");
      if (activeView === "pipeline") main.innerHTML = renderPipeline();
      if (activeView === "opportunities") main.innerHTML = renderOpportunities();
      if (activeView === "archive") main.innerHTML = renderArchive();
      if (activeView === "knowledge") main.innerHTML = renderKnowledge();
      if (activeView === "interview") main.innerHTML = renderInterviewEditor();
      if (activeView === "resumes") main.innerHTML = renderResumes();
      if (activeView === "job-detail") main.innerHTML = renderJobDescription();
    }

    function renderPageHeading(title, subtitle, actions = "") {
      return `<div class="page-heading"><div><h1>${title}</h1><div class="page-subtitle">${subtitle}</div></div>${actions ? `<div class="heading-actions">${actions}</div>` : ""}</div>`;
    }

    function renderPipeline() {
      const activeJobs = jobs.filter(job => job.status === "applied" && matchesSearch(job)).sort((a,b) => a.company.localeCompare(b.company, "zh-CN") || (b.updated || "").localeCompare(a.updated || ""));
      const terminatedJobs = jobs.filter(job => job.status === "closed" && matchesSearch(job)).sort((a,b) => a.company.localeCompare(b.company, "zh-CN") || (b.updated || "").localeCompare(a.updated || ""));
      const allJobs = [...activeJobs, ...terminatedJobs];
      const selected = allJobs.find(job => job.id === currentJobId) || activeJobs[0] || terminatedJobs[0];
      if (selected) currentJobId = selected.id;
      if (!selected) return `${renderPageHeading("正在推进", "当前没有已投递的岗位。") }<div class="empty-state"><strong>还没有正在推进的岗位</strong>从「看看机会」中把已投递岗位移入这里。</div>`;
      const heading = renderPageHeading("正在推进", `跟进 ${activeJobs.length} 个已投递岗位，按最近一次进展整理。`, `<button class="button" data-action="open-add" data-mode="url">${icon("link","sm")}从网址录入</button><button class="button primary" data-action="open-add" data-mode="file">${icon("plus","sm")}添加岗位</button>`);
      const renderRoleItem = job => `
        <button class="role-item ${job.status === "closed" ? "terminated" : ""} ${job.id === selected.id ? "selected" : ""}" data-action="select-job" data-job-id="${escapeHtml(job.id)}" aria-pressed="${job.id === selected.id}">
          <span class="company-mark ${escapeHtml(job.markTone)}">${escapeHtml(job.mark)}</span>
          <span class="role-copy"><span class="role-company">${escapeHtml(job.company)}</span><span class="role-title">${escapeHtml(job.title)}</span><span class="role-meta"><span>${escapeHtml(job.updated)}</span><span class="role-stage ${job.status === "closed" ? "terminated" : ""}">${escapeHtml(stageLabel(job))}</span></span></span>
        </button>`;
      const list = activeJobs.length ? activeJobs.map(renderRoleItem).join("") : `<div class="inline-empty">暂无推进中的岗位</div>`;
      const terminatedList = terminatedJobs.map(renderRoleItem).join("");
      const stageItems = stageNames.map((name, index) => {
        const state = index < selected.stageIndex ? "complete" : index === selected.stageIndex ? "current" : "";
        const node = index < selected.stageIndex ? icon("check") : "";
        return `<div class="stage-item ${state}"><button class="stage-node" ${selected.status === "closed" ? "disabled" : ""} data-action="set-stage" data-stage="${index}" aria-label="${escapeHtml(name)}：${index < selected.stageIndex ? "已完成" : index === selected.stageIndex ? "当前阶段" : "未开始"}">${node}</button><span class="stage-label">${escapeHtml(name)}</span><span class="stage-foot">${index === selected.stageIndex ? `${escapeHtml(stageLabel(selected))}` : ""}</span></div>`;
      }).join("");
      const roundButtons = rounds.map(round => {
        const session = getSession(selected, round.id);
        const complete = session.questions.length > 0 && session.result !== "进行中";
        const active = round.id === selected.activeRound;
        return `<button class="round-button ${complete ? "done" : ""} ${active ? "active" : ""}" data-action="open-interview" data-round="${round.id}" aria-label="打开${round.label}记录"><span class="round-dot"></span><span>${round.label}</span></button>`;
      }).join("");
      const activity = selected.activity.map((item, index) => `<div class="activity-row"><span class="activity-bullet"></span><span>${escapeHtml(item)}<span class="activity-time">${isDesktop ? "" : index === 0 ? escapeHtml(selected.updated) : ""}</span></span></div>`).join("");
      const tags = selected.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("");
      const terminateButton = selected.status === "applied"
        ? `<button class="button danger small" data-action="terminate-job" data-job-id="${escapeHtml(selected.id)}">${icon("close","sm")}终止流程</button>`
        : "";
      return `${heading}
        <div class="quick-stats" aria-label="进度概览"><div class="stat"><strong class="coral">${activeJobs.length}</strong><span>推进中岗位</span></div><div class="stat"><strong>${weekInterviews()}</strong><span>本周面试</span></div><div class="stat"><strong class="green">${jobs.reduce((count, job) => count + Object.values(job.sessions).filter(session => session.questions.length).length,0)}</strong><span>已归档轮次</span></div></div>
        <div class="workspace">
          <section class="role-list" aria-label="岗位列表"><div class="list-head"><strong>推进中</strong><span>${activeJobs.length} 个岗位</span></div>${list}${terminatedJobs.length ? `<div class="list-head"><strong>已终止</strong><span>${terminatedJobs.length} 个岗位</span></div>${terminatedList}` : ""}</section>
          <section class="detail-sheet" aria-label="岗位流程详情">

        const companyOrder = a.company.localeCompare(b.company, "zh-CN");
        if (companyOrder) return companyOrder;
        if (opportunitySort === "company") return a.title.localeCompare(b.title, "zh-CN");
        return (b[opportunitySort] || "").localeCompare(a[opportunitySort] || "") || a.title.localeCompare(b.title, "zh-CN");
      });
      const cities = [...new Set(available.map(job => job.city).filter(Boolean))];
      const heading = renderPageHeading("看看机会", `${available.length} 个尚未投递的岗位，按公司归组。`, `<button class="button" data-action="open-add" data-mode="url">${icon("link","sm")}从网址录入</button><button class="button primary" data-action="open-add" data-mode="file">${icon("upload","sm")}导入 JD</button>`);
      const rows = filtered.map(job => `<div class="opportunity-row" data-job-id="${escapeHtml(job.id)}"><button class="opportunity-main" data-action="show-job-jd" data-job-id="${escapeHtml(job.id)}" aria-label="查看 ${escapeHtml(job.company)} ${escapeHtml(job.title)} 的岗位 JD"><span class="company-mark ${escapeHtml(job.markTone || job.tone)}">${escapeHtml(job.mark)}</span><span class="opportunity-name"><span class="opportunity-company">${escapeHtml(job.company)} <span class="source-chip">${escapeHtml(job.source)}</span></span><span class="opportunity-title">${escapeHtml(job.title)} · ${escapeHtml(job.city)}</span></span></button><div class="opportunity-date ${job.posted ? "" : "missing"}">${job.posted ? fmtDate(job.posted) : "未提供"}</div><div class="opportunity-date">${fmtDate(job.created)}</div><button class="opportunity-jd-link" data-action="open-job-url" data-job-id="${escapeHtml(job.id)}" title="${escapeHtml(job.sourceUrl || "未记录岗位网址")}">${escapeHtml(shortUrl(job.sourceUrl))}</button><div class="row-actions"><button class="button small" data-action="apply-job" data-job-id="${escapeHtml(job.id)}" title="标记已投递">已投递 ${icon("arrow","sm")}</button><button class="icon-action" data-action="delete-job" data-job-id="${escapeHtml(job.id)}" aria-label="删除 ${escapeHtml(job.company)} ${escapeHtml(job.title)}" title="删除岗位">${icon("trash","sm")}</button></div></div>`).join("");

    }

    function getArchiveSessions() {
      return jobs.flatMap(job => rounds.flatMap(round => {
        const session = getSession(job, round.id);
        return session.questions.length ? [{ job, round, session }] : [];
      }));
    }

    function renderArchive() {
      const sessions = getArchiveSessions().filter(item => matchesSearch(item.job));
      const heading = renderPageHeading("面试记录", "按公司、岗位和轮次整理的复盘档案。", `<button class="button" data-action="new-interview">${icon("plus","sm")}新建复盘</button>`);
      if (!sessions.length) return `${heading}<div class="detail-sheet"><div class="empty-state"><strong>还没有面试复盘</strong>投递岗位后，点击正在推进中的一面、二面、三面或 HR 面节点开始记录。</div></div>`;
      const selectedItem = sessions.find(item => item.job.id === archiveSelection.jobId && item.round.id === archiveSelection.roundId) || sessions[0];
      const selectedJob = selectedItem.job;
      const selectedRound = selectedItem.round;
      const session = getSession(selectedJob, selectedRound.id);
      const companies = [...new Set(sessions.map(item => item.job.company))];
      const tree = companies.map(company => {
        const companyJobs = [...new Map(sessions.filter(item => item.job.company === company).map(item => [item.job.id, item.job])).values()];
        const companyMark = companyJobs[0]?.mark || company.slice(0,1);
        return `<div class="tree-company">${icon("folder","sm")}<span>${escapeHtml(company)}</span></div>${companyJobs.map(job => `<button class="tree-job ${job.id === selectedJob.id ? "selected" : ""}" data-action="select-archive-job" data-job-id="${escapeHtml(job.id)}">${icon("chevron","sm")}<span>${escapeHtml(job.title)}</span></button><div class="tree-rounds">${rounds.filter(round => getSession(job, round.id).questions.length).map(round => `<button class="tree-round ${job.id === selectedJob.id && round.id === selectedRound.id ? "selected" : ""}" data-action="select-archive-round" data-job-id="${escapeHtml(job.id)}" data-round="${round.id}"><span>${escapeHtml(round.label)}</span><span class="tree-round-count">${getSession(job, round.id).questions.length} 题</span></button>`).join("")}</div>`).join("")}`;
      }).join("");
      const qa = session.questions.map((item, index) => `<article class="archive-pair"><div class="archive-cell"><div class="archive-label">题目 ${String(index + 1).padStart(2,"0")}</div><div class="archive-text">${escapeHtml(item.question || "未填写题目")}</div></div><div class="archive-cell"><div class="archive-label">回答</div><div class="archive-text">${escapeHtml(item.answer || "尚未记录回答")}</div></div></article>`).join("");

            <div class="knowledge-actions"><button class="button primary small" data-action="save-knowledge">${icon("save","sm")}保存</button><button class="icon-action" data-action="delete-knowledge" aria-label="删除知识文档" title="删除知识文档">${icon("trash","sm")}</button></div>

    function renderInterviewEditor() {
      const job = getJob(currentJobId) || jobs[0];
      if (!job) return `${renderPageHeading("面试复盘", "") }<div class="detail-sheet"><div class="empty-state"><strong>还没有可编辑的面试</strong>先将一个岗位标记为已投递。</div></div>`;
      const round = rounds.find(item => item.id === currentRoundId) || rounds[0];
      const session = getSession(job, round.id);
      if (!session.questions.length) session.questions.push({ id: `q-${Date.now()}`, question: "", answer: "" });
      if (!session.questions.some(item => item.id === currentQuestionId)) currentQuestionId = session.questions[0].id;
      const question = session.questions.find(item => item.id === currentQuestionId) || session.questions[0];
      const tabs = session.questions.map((item, index) => `<button class="question-tab ${item.id === question.id ? "selected" : ""}" data-action="select-question" data-question-id="${escapeHtml(item.id)}" aria-label="选择第 ${index + 1} 道题">${index + 1}</button>`).join("");
      const heading = `<div class="page-heading"><div><button class="button quiet small" data-action="back-to-job">${icon("back","sm")}返回岗位</button><h1 style="margin-top:10px">${escapeHtml(round.label)} · 面试复盘</h1><div class="page-subtitle">${escapeHtml(job.company)} · ${escapeHtml(job.title)}</div></div><div class="heading-actions"><button class="button" data-action="open-archive">${icon("book","sm")}查看归档</button><button class="button primary" data-action="save-interview">${icon("save","sm")}保存记录</button></div></div>`;
      return `${heading}<div class="detail-sheet"><div class="detail-head"><div class="company-title"><span class="company-mark ${escapeHtml(job.markTone)}">${escapeHtml(job.mark)}</span><div><div class="company-name">本轮面试信息</div><div class="job-inline-meta" style="margin-top:8px"><span class="badge ${session.result === "通过" ? "green" : ""}">${escapeHtml(session.result || "进行中")}</span></div></div></div><div class="editor-meta"><label class="sr-only" for="round-choice">面试轮次</label><select id="round-choice">${rounds.map(item => `<option value="${item.id}" ${item.id === round.id ? "selected" : ""}>${item.label}</option>`).join("")}</select><label class="sr-only" for="interview-date">面试日期</label><input id="interview-date" type="date" value="${escapeHtml(session.date)}"><label class="sr-only" for="interview-result">面试结果</label><select id="interview-result">${["进行中","待安排","通过","待反馈","未通过"].map(value => `<option ${value === session.result ? "selected" : ""}>${value}</option>`).join("")}</select></div></div><div class="qa-workspace"><section class="qa-column"><div class="qa-column-head"><strong>题目</strong><button class="button small" data-action="add-question">${icon("plus","sm")}添加题目</button></div><div class="question-list" aria-label="本轮题目">${tabs}</div><div class="editor-field"><label class="field-label" for="question-text"><span>题目内容</span><span>题目 ${session.questions.indexOf(question) + 1} / ${session.questions.length}</span></label><textarea id="question-text" class="editor-area" placeholder="记录面试官提出的问题...">${escapeHtml(question.question)}</textarea><div class="editor-foot"><span>按面试顺序整理，方便复盘回看</span><button class="button quiet small" data-action="remove-question" ${session.questions.length <= 1 ? "disabled" : ""}>${icon("trash","sm")}删除题目</button></div></div></section><section class="qa-column"><div class="qa-column-head"><strong>回答</strong><span>个人复盘内容</span></div><div class="editor-field"><label class="field-label" for="answer-text"><span>我的回答</span><span>可持续补充</span></label><textarea id="answer-text" class="editor-area answer" placeholder="写下当时的回答、思路和遗漏点...">${escapeHtml(question.answer)}</textarea><div class="editor-foot"><span>回答与题目分开保存</span><span class="save-status"><i class="status-dot"></i>本地草稿</span></div></div></section></div><div style="padding:15px 17px 17px"><label class="field-label" for="session-summary">本轮总结</label><textarea id="session-summary" class="session-summary" placeholder="记录面试感受、待补知识点或后续行动">${escapeHtml(session.summary)}</textarea></div></div>`;
    }

    function openAddDialog(mode = "file") {
      addMode = mode;
      setAddMode(mode);
      $("#add-dialog").showModal();
    }
    function previewImport(drafts) {
      importDrafts = drafts;
      const batch = drafts.length > 1;
      $("#batch-preview").hidden = !batch;
      $("#file-fields").hidden = batch;
      $("#file-label").textContent = `已读取 ${drafts.length} 个岗位`;
      $("#file-note").textContent = batch ? "勾选要导入的岗位，可展开每条记录修正字段。保存后统一加入看看机会。" : "已在本机解析文件，检查并补全公司与岗位名称后保存。";
      if (batch) {
        $("#batch-preview").innerHTML = drafts.map((draft, index) => `<details class="import-row" data-import-index="${index}" style="border-bottom:1px solid var(--rule);padding:10px 0"><summary style="cursor:pointer;font-size:12px"><input type="checkbox" class="import-include" checked aria-label="导入第 ${index + 1} 个岗位"> ${index + 1}. ${escapeHtml(draft.company || "待填写公司")} · ${escapeHtml(draft.title || "待填写岗位")}</summary><div class="form-grid" style="margin:12px 0">${[["company","公司"],["title","岗位"],["city","城市"],["publishedAt","发布时间"]].map(([key,label]) => `<div class="form-field"><label for="import-${index}-${key}">${label}</label><input id="import-${index}-${key}" data-field="${key}" type="${key === "publishedAt" ? "date" : "text"}" value="${escapeHtml(draft[key] || "")}"></div>`).join("")}<div class="form-field full"><label for="import-${index}-jd">岗位描述</label><textarea id="import-${index}-jd" data-field="jd">${escapeHtml(draft.jd || "")}</textarea></div></div></details>`).join("");
      } else {
        const draft = drafts[0];
        $("#file-company").value = draft.company || "";
        $("#file-title").value = draft.title || "";
        $("#file-published").value = draft.publishedAt || "";
        $("#file-city").value = draft.city || "";
        $("#file-jd").value = draft.jd || "";
        $("#file-note").dataset.source = draft.source || "manual";
        $("#file-note").dataset.sourceUrl = draft.sourceUrl || "";
      }
    }
    function setAddMode(mode) {
      addMode = mode;
      $$(".dialog-tab").forEach(button => {
        const active = button.dataset.mode === mode;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", String(active));
      });
      $$('[data-mode-panel]').forEach(panel => panel.hidden = panel.dataset.modePanel !== mode);

      if (addMode === "manual") fields = { company: $("#manual-company").value, title: $("#manual-title").value, city: $("#manual-city").value, posted: $("#manual-published").value, source: "手动录入", jd: $("#manual-jd").value };
      if (addMode === "file") fields = { company: $("#file-company").value, title: $("#file-title").value, city: $("#file-city").value, posted: $("#file-published").value, source: $("#file-note").dataset.source || ($("#job-file").files?.[0]?.name.endsWith(".md") ? "Markdown" : "docx"), sourceUrl: $("#file-note").dataset.sourceUrl || "", jd: $("#file-jd").value };
      if (addMode === "url") fields = { company: $("#url-company").value, title: $("#url-title").value, city: $("#url-city").value, posted: $("#url-published").value, source: "url", sourceUrl: $("#url-note").dataset.sourceUrl || $("#job-url").value, jd: $("#url-jd").value };
      if (!fields?.company.trim() || !fields?.title.trim()) { showToast("请先填写公司和岗位名称"); (addMode === "file" ? $("#file-company") : addMode === "url" ? $("#url-company") : $("#manual-company")).focus(); return; }
      try {
        saveButton.disabled = true;
        await addOpportunity(fields);
        $("#add-dialog").close(); setView("opportunities"); showToast(`${fields.company} · ${fields.title} 已加入看看机会`);
      } catch (error) {
        showToast(`岗位未保存：${String(error)}`);
      } finally {
        saveButton.disabled = false;
      }
    });

    render();
    initializeDesktop();
  </script>
</body>
</html>
