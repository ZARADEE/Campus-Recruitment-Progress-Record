[package]
name = "campus-job-tracker"
version = "0.1.0"
description = "Local-first campus recruiting and interview tracker"
authors = ["Campus Job Tracker"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "campus_job_tracker_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
encoding_rs = "0.8"
pulldown-cmark = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "charset", "rustls-tls"] }
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
