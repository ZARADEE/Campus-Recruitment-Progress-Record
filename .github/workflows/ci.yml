name: Windows CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test and build (Windows)
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run Rust tests
        run: npm run desktop:test

      - name: Build frontend
        run: npm run build

      - name: Build Tauri desktop app
        run: npm run desktop:build
